artifacts_root: artifacts

data_source:
  root_dir: artifacts/data_source
  local_data_file: artifacts/data_source/data.zip
  unzip_dir: artifacts/data_source

prepare_base_model:
  root_dir: artifacts/prepare_base_model
  base_model_path: artifacts/prepare_base_model/base_model.keras
  updated_base_model_path: artifacts/prepare_base_model/base_model_updated.keras
prepare_callbacks:
  root_dir: artifacts/prepare_callbacks
  tensorboard_root_log_dir: artifacts/prepare_callbacks/saving_tensorboard_log_dir
  checkpoint_model_filepath: artifacts/prepare_callbacks/checkpoints_dir/vgg16model.keras




training:
  root_dir: artifacts/training
  training_data_dir: /kaggle/working/binary_dataset/train
  validation_split: 0.20
  kaggle_data_dir: /kaggle/working/binary_dataset
  trained_model_path: artifacts/training/vgg16model.keras
  metadata_dir: artifacts/training/run_metadata

# Evaluation applies a fixed threshold configured before evaluating this
# labeled test directory; it does not tune the threshold on validation or test.
evaluation:
  root_dir: artifacts/evaluation
  weights_archive_path: artifacts/training/vgg16model.zip
  reconstructed_model_path: artifacts/training/vgg16model_reconstructed.keras
  test_data_dir: /kaggle/working/binary_dataset/eval
  metrics_output_path: artifacts/evaluation/metrics.json
  predictions_output_path: artifacts/evaluation/predictions.csv
  class_names: [cancerous,non_cancerous]
  # Must follow class_names index order; test folders use a hyphen in class 1.
  test_directory_class_names: [cancerous,non_cancerous]
  positive_class: cancerous
  decision_threshold: 0.6
  # Number of class-stratified bootstrap resamples used for confidence intervals.
  bootstrap_samples: 1000
  confidence_level: 0.95
  # Set these only after checking the source labels and train/test overlap.
  class_mapping_verified: false
  dataset_independence_verified: false
