
# 1. Tell DVC to read your config file
vars:
  - config/config.yaml
stages:


  prepare_base_model:
    cmd: python src/vgg16classifier/pipeline/stage_02_prepare_base_model.py
    deps:
      - src/vgg16classifier/pipeline/stage_02_prepare_base_model.py
      - src/vgg16classifier/components/prepare_base_model.py
      - src/vgg16classifier/config/configuration.py
      - src/vgg16classifier/entity/configaration_entities.py
      - src/vgg16classifier/utils/common.py
      - src/vgg16classifier/constants/__init__.py
      - src/vgg16classifier/__init__.py
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES
      - WEIGHTS
      - LEARNING_RATE
      - AUGMENTATION_BRIGHTNESS_FACTOR
      - HEAD_DROPOUT_RATE
      - HEAD_L2_STRENGTH
    outs:
      - artifacts/prepare_base_model



  training:
    cmd: python src/vgg16classifier/pipeline/stage_03_training.py
    deps:
      - src/vgg16classifier/pipeline/stage_03_training.py
      - src/vgg16classifier/components/prepare_callbacks.py
      - src/vgg16classifier/components/training.py
      - src/vgg16classifier/components/run_metadata.py
      - src/vgg16classifier/config/configuration.py
      - src/vgg16classifier/entity/configaration_entities.py
      - src/vgg16classifier/utils/common.py
      - src/vgg16classifier/__init__.py
      - config/config.yaml
      - ${training.training_data_dir}
      - artifacts/prepare_callbacks
      - artifacts/prepare_base_model
    params:
      - IMAGE_SIZE
      - EPOCHS
      - FINE_TUNE_EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
      - AUGMENTATION_BRIGHTNESS_FACTOR
      - SEED
      - LEARNING_RATE
      - FINE_TUNE_LEARNING_RATE
      - FINE_TUNE_LAYERS
      - HEAD_DROPOUT_RATE
      - HEAD_L2_STRENGTH
      - EARLY_STOPPING_PATIENCE
    outs:
      - ${training.trained_model_path}
      - ${training.metadata_dir}


  duplicate_detection:
    cmd: python src/vgg16classifier/pipeline/stage_o1_data.py
    deps:
      - src/vgg16classifier/pipeline/stage_o1_data.py
      - src/vgg16classifier/components/data_processing.py
      - artifacts/data_source/Binary_Classification
    outs:
      - artifacts/image_test/resnet_embeddings.npz


  evaluation:
    cmd: python src/vgg16classifier/pipeline/stage_04_evaluation_keras3.py
    deps:
      - src/vgg16classifier/pipeline/stage_04_evaluation_keras3.py
      - src/vgg16classifier/components/evaluation_keras3.py
      - src/vgg16classifier/components/evaluation.py
      - src/vgg16classifier/config/configuration.py
      - src/vgg16classifier/entity/configaration_entities.py
      - src/vgg16classifier/utils/common.py
      - src/vgg16classifier/constants/__init__.py
      - src/vgg16classifier/__init__.py
      - config/config.yaml
      - ${evaluation.test_data_dir}
      - ${training.trained_model_path}
      - ${training.metadata_dir}
      - artifacts/image_test/resnet_embeddings.npz
    params:
      - IMAGE_SIZE
      - BATCH_SIZE
    outs:
      - ${evaluation.predictions_output_path}
    metrics:
    - ${evaluation.metrics_output_path}:
        cache: false
